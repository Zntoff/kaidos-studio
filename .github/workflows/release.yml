# Production releases. Pushing a tag vX.Y.Z that points to a commit on main builds the three formats
# (Windows installer, portable ZIP and Docker bundle), runs the tests and creates a draft GitHub Release.
# Running it manually from the Actions tab (on dev or any branch) only builds the packages as artifacts.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Check tag, version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: check
        name: Verify
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main. Releases are tagged on main only."
              exit 1
            fi
            version=$(python scripts/check-version.py --tag "$GITHUB_REF_NAME" --changelog)
          else
            version=$(python scripts/check-version.py)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer and portable ZIP
    needs: guard
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build installer and portable ZIP
        shell: pwsh
        run: |
          $expected = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '' }
          ./release.ps1 -Target Desktop -ExpectedVersion $expected -OutputDirectory artifacts/windows
      - name: Native integration checks (offline)
        shell: pwsh
        run: dotnet run --project desktop/ClipperStudio.Tests -c Release
      - name: Installer round trip
        shell: pwsh
        run: |
          $manifest = Get-Content artifacts/windows/release-manifest.json -Raw | ConvertFrom-Json
          ./desktop/installer/test-install.ps1 -Installer "artifacts/windows/KairosStudio-$($manifest.version)-Setup-win-x64.exe" -Version $manifest.version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: artifacts/windows/*
          if-no-files-found: error

  docker:
    name: Docker image and bundle
    # After Windows, so a tag whose desktop build fails never publishes an image.
    needs: [guard, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Docker image and downloadable bundle
        shell: pwsh
        run: |
          $expected = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '' }
          ./release.ps1 -Target Docker -ExpectedVersion $expected -OutputDirectory artifacts/docker
      - name: Container regression checks
        run: docker run --rm --entrypoint sh "kairos-studio:${{ needs.guard.outputs.version }}" -c 'pip install --quiet pytest && pytest -q'
      - name: Publish the image to GitHub Packages
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/kairos-studio"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "$VERSION" latest; do
            docker tag "kairos-studio:$VERSION" "$image:$tag"
            docker push "$image:$tag"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: docker-release
          path: artifacts/docker/*
          if-no-files-found: error

  draft:
    name: Draft GitHub Release
    if: github.ref_type == 'tag'
    needs: [guard, windows, docker]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release notes from the changelog
        run: |
          python scripts/check-version.py --tag "$GITHUB_REF_NAME" --notes notes.md
          { echo; echo '---'; echo; cat distribution/RELEASE-NOTES.md; } >> notes.md
      - name: Combined checksums and draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir combined
          cp artifacts/windows-release/*.exe artifacts/windows-release/*.zip artifacts/docker-release/*.zip combined/
          (cd combined && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" combined/* --verify-tag --draft \
            --title "Kairos Studio $GITHUB_REF_NAME" --notes "$(cat notes.md)" --generate-notes
