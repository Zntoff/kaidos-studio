# Weekly update pull requests against dev, so they go through CI before reaching main.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: nuget
    directory: /desktop/ClipperStudio
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
